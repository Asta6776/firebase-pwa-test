<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Test</title>
    
    <!-- Eruda Mobile Dev Tools (Gives us a console on our phone screen) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>

    <h1>Firebase Testing Ground</h1>
    <p>Check the floating gear icon at the bottom right to see the console logs!</p>

    <!-- 1. Load Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // 2. REPLACE THIS WITH YOUR ACTUAL CONFIG FROM FIREBASE CONSOLE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 3. Try to Initialize
        console.log("Attempting to connect to Firebase...");
        
        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            console.log("✅ Success! Firebase initialized smoothly.");
            console.log("Firebase Auth Object:", auth);
        } catch (error) {
            console.error("❌ Initialization failed:", error.message);
        }
    </script>
</body>
</html>
